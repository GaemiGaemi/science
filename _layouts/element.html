<!doctype html>
<html>
  <head>
    {% include head.html %}
  </head>
  <body>

  <div class="container">
    
    <section id="title_detail">
    <h1>Details of Element</h1>
    </section>

    <section class="element-page">
      <h1>{{ page.title }} ({{ page.symbol }})</h1>
      <p>원자번호: {{ page.number }}</p>
      <p>원자량: {{ page.weight }}</p>
      <p>전자배치: {{ page.electron }} </p>

    </section>
    <section class="element-page">
      <h1>2번칸</h1>
      <div class="content">
        {{ content }}
      </div>
    </section>
    <section class="element-page">
      <h1>3번칸</h1>
    </section>

    <!-- 4번: Footer 영역 -->
    <footer class="footer">
      <p> THIS IS FOOTER</p>
    </footer>

  </div>
  <script src="{{ '/assets/script.js' | relative_url }}"></script>
  {% if page.floating_ad %}
  {% include floating-ad.html %}
  {% endif %}
</body>
</html>
