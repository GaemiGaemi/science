<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> 싸 이 언 쓰 </title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <section class="section hero">
      <img src="science.PNG" alt="로고 이미지" />
    </section>
    <section class="section middle">
      <h2>중간 내용 (2번칸)</h2>
    </section>
    <section class="section third">
      <h2>아래 내용 (3번칸)</h2>
      <p>충분한 스크롤을 위한 더미 텍스트</p>
      <div class="spacer"></div>
    </section>



    <!-- 메뉴 버튼 -->
    <button class="menu-btn" id="menuOpenBtn">☰ 메뉴</button>

    <!-- 메뉴 오버레이 -->
    <div class="menu-overlay" id="menu">
      <div class="menu-content">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      <button id="menuCloseBtn">X</button>
      </div>
    </div>


    <!-- AD -->
    <div class="floating-ad" id="floatingAd">
      <a href="https://your-affiliate-link.com" target="_blank">
      <img src="/assets/images/your-banner.jpg" alt="광고 배너">
      </a>
      <button class="ad-close-btn" onclick="document.getElementById('floatingAd').style.display='none'">✕</button>
    </div> <!-- End AD-->


  </div> <!--End Wrap-->

  <script src="script.js"></script>
</body>
</html>
