<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> 싸 이 언 쓰 </title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <section class="section hero">
      <img src="science.png" alt="로고 이미지" />
    </section>
    <section class="section middle">
      <h2>중간 내용 (2번칸)</h2>
      
  <h1>원소 주기율표 (TEST)</h1>
  <div class="table">
    <a href="elements/H.md" class="element alkali" style="grid-column: 1; grid-row: 1;">
      <span class="number">1</span>
      <span class="symbol">H</span>
      <span class="detail">1.008</span>
    </a>
    <div class="empty" style="grid-column: 2 / span 16;"></div>
    <a href="elements/He.md" class="element noble-gas" style="grid-column: 18; grid-row: 1;">
      <span class="number">2</span>
      <span class="symbol">He</span>
      <span class="detail">4.0026</span>
    </a>

    <a href="elements/Li.md" class="element alkali" style="grid-column: 1; grid-row: 2;">
      <span class="number">3</span>
      <span class="symbol">Li</span>
      <span class="detail">6.94</span>
    </a>
    <a href="elements/Be.md" class="element alkaline" style="grid-column: 2; grid-row: 2;">
      <span class="number">4</span>
      <span class="symbol">Be</span>
      <span class="detail">9.0122</span>
    </a>
    <div class="empty" style="grid-column: 3 / span 10; grid-row: 2;"></div>
    <a href="elements/B.md" class="element metalloid" style="grid-column: 13; grid-row: 2;">
      <span class="number">5</span>
      <span class="symbol">B</span>
      <span class="detail">10.81</span>
    </a>
    <a href="elements/C.md" class="element nonmetal" style="grid-column: 14; grid-row: 2;">
      <span class="number">6</span>
      <span class="symbol">C</span>
      <span class="detail">12.01</span>
    </a>
    <a href="elements/N.md" class="element nonmetal" style="grid-column: 15; grid-row: 2;">
      <span class="number">7</span>
      <span class="symbol">N</span>
      <span class="detail">14.01</span>
    </a>
    <a href="elements/O.md" class="element nonmetal" style="grid-column: 16; grid-row: 2;">
      <span class="number">8</span>
      <span class="symbol">O</span>
      <span class="detail">16.00</span>
    </a>
    <a href="elements/F.md" class="element halogen" style="grid-column: 17; grid-row: 2;">
      <span class="number">9</span>
      <span class="symbol">F</span>
      <span class="detail">19.00</span>
    </a>
    <a href="elements/Ne.md" class="element noble-gas" style="grid-column: 18; grid-row: 2;">
      <span class="number">10</span>
      <span class="symbol">Ne</span>
      <span class="detail">20.18</span>
    </a>
    <!-- 나머지 원소들도 위와 같은 구조로 추가 가능 -->
  </div> <!--원소기호 끝-->



    </section>
    <section class="section third">
      <h2>아래 내용 (3번칸)</h2>
      <p>충분한 스크롤을 위한 더미 텍스트</p>
      <div class="spacer"></div>
    </section>



    <!-- 메뉴 버튼 -->
    <button class="menu-btn" id="menuOpenBtn">☰ 메뉴</button>

    <!-- 메뉴 오버레이 -->
    <div class="menu-overlay" id="menu">
      <div class="menu-content">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      <button id="menuCloseBtn">X</button>
      </div>
    </div>


    <!-- AD -->
    <div class="floating-ad" id="floatingAd">
            <iframe src="https://ads-partners.coupang.com/widgets.html?id=866529&template=carousel&trackingCode=AF9023285&subId=&width=300&height=300&tsource=" width="140" height="140" frameborder="0" scrolling="no" referrerpolicy="unsafe-url" browsingtopics></iframe>

      <a href="https://link.coupang.com/a/cuqXGu" target="_blank">
        <img src="/assets/images/your-banner.jpg" alt="광고 배너">
      </a>
      -->
      <p class="ad-disclaimer">
        이 광고창은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.
      </p>
      <button class="ad-close-btn" onclick="document.getElementById('floatingAd').style.display='none'">✕</button>
    </div><!-- End AD -->

  </div> <!--End Wrap-->

  <script src="script.js"></script>
</body>
</html>
